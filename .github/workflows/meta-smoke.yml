name: Meta API single-call smoke test
on:
  workflow_dispatch:
    inputs:
      capability:
        description: Select ONE capability; image is a billable image generation
        required: true
        type: choice
        options: [text, vision, image]
        default: text
      confirm_billable:
        description: Type I_ACKNOWLEDGE_ONE_PAID_REQUEST to authorize one request, no retries
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: meta-manual-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: ${{ inputs.confirm_billable == 'I_ACKNOWLEDGE_ONE_PAID_REQUEST' }}
    runs-on: ubuntu-latest
    environment: meta-live-test
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      META_MODEL: muse-spark-1.3
      META_SMOKE_ACK: ${{ inputs.confirm_billable }}
      META_SMOKE_CAPABILITY: ${{ inputs.capability }}
      DATABASE_URL: sqlite:///./meta-smoke.sqlite3
      INFERENCE_PROVIDER: meta
      SENTINELX_MODE: live
      ALLOW_PAID_INFERENCE: 'true'
      ENABLE_LIVE_MULTIMODAL: 'true'
      META_APP_BUDGET_CENTS: '5'
      META_WORKSPACE_BUDGET_CENTS: '5'
      META_RUN_BUDGET_CENTS: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client and accounting dependencies
        run: python -m pip install -r requirements.txt
      - name: Single selected bounded live request
        run: python scripts/meta_smoke.py
