name: Meta API single-call smoke test
on:
  workflow_dispatch:
    inputs:
      confirm_billable:
        description: "Type I_ACKNOWLEDGE_ONE_PAID_REQUEST to authorize one billable call"
        required: true
        type: string

permissions:
  contents: read
jobs:
  smoke:
    if: ${{ inputs.confirm_billable == 'I_ACKNOWLEDGE_ONE_PAID_REQUEST' }}
    runs-on: ubuntu-latest
    environment: meta-live-test
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      META_MODEL: muse-spark-1.3
      META_SMOKE_ACK: ${{ inputs.confirm_billable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client
        run: python -m pip install 'openai>=1.70,<3'
      - name: Single bounded live request
        run: python scripts/meta_smoke.py
