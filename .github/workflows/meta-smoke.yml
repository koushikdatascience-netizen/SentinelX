name: Meta API single-capability smoke test
on:
  workflow_dispatch:
    inputs:
      capability:
        description: "Exactly one real provider capability to test"
        required: true
        type: choice
        options:
          - text
          - vision
          - image
      confirm_billable:
        description: "Type I_ACKNOWLEDGE_ONE_PAID_REQUEST to authorize one billable request"
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: meta-capability-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: ${{ inputs.confirm_billable == 'I_ACKNOWLEDGE_ONE_PAID_REQUEST' }}
    runs-on: ubuntu-latest
    environment: meta-live-test
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      META_MODEL: muse-spark-1.3
      META_SMOKE_CAPABILITY: ${{ inputs.capability }}
      META_SMOKE_ACK: ${{ inputs.confirm_billable }}
      INFERENCE_PROVIDER: meta
      SENTINELX_MODE: live
      ALLOW_PAID_INFERENCE: "true"
      ENABLE_LIVE_MULTIMODAL: "true"
      META_APP_BUDGET_CENTS: "20"
      DATABASE_URL: sqlite:///./meta-smoke.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install controlled SDK dependencies
        run: python -m pip install -r requirements.txt
      - name: One guarded live capability test
        run: python scripts/meta_smoke.py
