services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - sentinelx_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sentinelx -d sentinelx"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINELX_MODE: demo
      DATABASE_URL: postgresql+psycopg://sentinelx:${POSTGRES_PASSWORD}@db:5432/sentinelx
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-demo}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      ALLOW_PAID_INFERENCE: ${ALLOW_PAID_INFERENCE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  sentinelx_pg:
